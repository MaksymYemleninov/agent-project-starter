name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ADR gate diffs against the base commit, so shallow history is not enough.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Both scripts have zero npm dependencies on purpose: the gates must work on day one,
      # before any stack exists, and must not break when the stack changes.
      - name: Lint documentation
        run: npm run lint:docs

      - name: Test the gates
        run: npm run test:gates

      - name: Check ADR drift
        if: "!contains(github.event.pull_request.labels.*.name, 'no-adr-needed')"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: npm run check:adr

  code:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `--if-present` means this job is correct before and after /onboard: it does nothing while
      # the scripts do not exist, and runs them the moment they do. /onboard replaces this job
      # outright if the stack is not Node.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile yet. /onboard sets up the toolchain."
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present
