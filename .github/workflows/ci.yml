name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Both scripts have zero npm dependencies on purpose: the gates must work on day one,
      # before any stack exists, and must not break when the stack changes.
      - name: Lint documentation
        run: npm run lint:docs

      - name: Test the gates
        run: npm run test:gates

  secrets:
    name: Secret scan
    # Every stage, like the secret guard: a leaked credential is not a process question.
    # The gitleaks CLI rather than its GitHub Action, which needs a paid licence for organisations.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  adr:
    name: ADR drift
    # Pull requests only, deliberately. See docs/decisions/0003-run-the-adr-gate-on-pull-requests-only.md
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base commit, so shallow history is not enough.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check ADR drift
        if: "!contains(github.event.pull_request.labels.*.name, 'no-adr-needed')"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check:adr
