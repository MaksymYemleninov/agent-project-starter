name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint documentation
        run: npm run lint:docs

      - name: Check ADR drift
        if: "!contains(github.event.pull_request.labels.*.name, 'no-adr-needed')"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: npm run check:adr

  code:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # /onboard replaces this job with the real toolchain for the chosen stack.
      # Until then it passes, so the documentation gates are usable from day one.
      - name: Not scaffolded yet
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile yet. /onboard sets up the toolchain."
          fi
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)" 2>/dev/null; then
            npm test
          else
            echo "No test script yet. /onboard adds one."
          fi
