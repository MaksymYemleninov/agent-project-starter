name: CI

on:
  pull_request:
    # `edited` so that adding an escape reason to the description re-runs the gates (spec 0002).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Both scripts have zero npm dependencies on purpose: the gates must work on day one,
      # before any stack exists, and must not break when the stack changes.
      - name: Lint documentation
        run: npm run lint:docs

      - name: Test the gates
        run: npm run test:gates

      - name: Test regressions
        run: npm run test:regressions

      - name: Test a derived project
        run: npm run test:derived

  secrets:
    name: Secret scan
    # Every stage, like the secret guard: a leaked credential is not a process question.
    # The gitleaks CLI rather than its GitHub Action, which needs a paid licence for organisations.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  adr:
    name: ADR drift
    # Pull requests only, deliberately. See docs/decisions/0003-run-the-adr-gate-on-pull-requests-only.md
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base commit, so shallow history is not enough.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check ADR drift
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          # The description is read as data through env, never interpolated into the command. Only a
          # `No-ADR-reason:` line in it justifies the triggers; a label does not (ADR 0016).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:adr

      # A step of this job, not a job of its own: "ADR drift" is already a required check, so the
      # documentation gate blocks merges from the day it lands instead of after a settings change.
      - name: Check documentation for the change
        if: always()
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run check:docs
